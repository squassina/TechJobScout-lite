name: Static client validation

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Run client-side smoke tests
        run: node --test
      - name: Verify static app entrypoints
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
      - name: Enforce client-only persistence policy
        run: |
          ! grep -nE '(/api/config|/api/scout|indexedDB|document\.cookie)' app.js index.html
          test "$(grep -o 'localStorage\.' app.js | wc -l)" -le 4
          grep -q 'tjs_lite_api_keys' app.js
