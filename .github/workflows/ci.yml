name: Static client validation
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate all JavaScript modules
        run: npm run check
      - name: Run unit and smoke tests
        run: npm test
      - name: Verify static app entrypoints
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'type="module"' index.html
      - name: Enforce client-only persistence policy
        run: |
          ! grep -R -nE '(/api/config|/api/scout|indexedDB|document\.cookie)' app.js src index.html
          grep -q 'tjs_lite_api_keys' app.js
